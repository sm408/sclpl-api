[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sclplapi"
version = "0.1.0"
description = "Local-first, Python-first API workflow studio"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "aiosqlite>=0.20,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "textual>=0.40,<1",
]

[project.scripts]
sclplapi = "app.ui.cli:app"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
excel = [
    "openpyxl>=3.1,<4",
]
all = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "openpyxl>=3.1,<4",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.5,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "openpyxl>=3.1,<4",
    "textual>=0.40,<1",
    "cryptography>=42,<44",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
# Include built SPA assets in the wheel
"app/web/static" = "app/web/static"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
