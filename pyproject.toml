[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sclpl"
version = "0.9.1"
description = "A command-line pipeline runner for HTTP APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27,<1",
    "typer>=0.12,<1",
    "pydantic>=2.5,<3",
    "pyarrow>=16,<21",
]

# `rich` is deliberately absent: the terminal layer is hand-written (SPEC decision 7).
# `textual`, `fastapi`, and `uvicorn` went with the TUI and the web studio (decision 6).

[project.scripts]
sclpl = "sclpl.cli.app:entrypoint"

[project.optional-dependencies]
data = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
]
# Two extras rather than one: a server with no keyring daemon should not have to
# install a keyring to get the encrypted-file backend, and a laptop with a Keychain
# should not need `cryptography` it will never use.
keyring = [
    "keyring>=25,<26",
]
crypto = [
    "cryptography>=42,<46",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["sclpl"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/attic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sclpl", "tests"]
exclude = "docs/attic"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "numpy", "numpy.*", "keyring.*", "cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
