name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and type-check once, on the fastest runner: neither depends on the OS, and
  # running them per-platform would only add cost, not coverage.
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Lint
        run: |
          python -m ruff check sclpl tests scripts
          python -m ruff format --check sclpl tests scripts

      - name: Types
        run: python -m mypy --python-version "${{ matrix.python-version }}"

      - name: Line budget
        run: python scripts/check_budget.py

  # J2: the full suite across every supported OS. `data` stays out of the base matrix
  # (see `extras` below) so this matrix answers one question only -- does the platform
  # itself work -- without also re-testing optional-dependency fallbacks three times.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Tests
        run: python -m pytest -q

  # J2: a bare install -- no [data], [keyring], or [crypto] extra -- must still import,
  # start, and fail *clearly* (MissingExtra, NoSecureStorage) rather than crash the
  # moment a workflow touches a table or a secret. This is a packaging question, not an
  # OS one, so one platform is enough; the sentinel tests already simulate every
  # combination of installed/missing backends via monkeypatch regardless of what is
  # actually on the runner (tests/unit/test_state_secrets.py, tests/unit/test_tables.py),
  # so this job does not need a real matrix of extras to get that coverage -- it exists
  # to catch the one thing they cannot: an accidental hard import of an optional
  # dependency somewhere outside its lazy-loaded backend.
  bare-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install without optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: CLI starts
        run: python -m sclpl --help

      - name: Sentinel tests
        # Only the tests that simulate a missing extra via monkeypatch -- the rest of
        # test_tables.py exercises real pandas I/O and needs [data] installed, which
        # this job deliberately does not have.
        run: |
          python -m pytest -q \
            tests/unit/test_state_secrets.py \
            "tests/unit/test_tables.py::test_a_missing_pandas_extra_is_a_clear_error_not_a_traceback"
